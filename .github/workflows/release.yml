name: Publish Windows release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 25
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      DOTNET_SKIP_FIRST_TIME_EXPERIENCE: '1'
      TESTINGPLATFORM_TELEMETRY_OPTOUT: '1'
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: '**/packages.lock.json'
      - name: Validate tag and complete release pipeline
        shell: pwsh
        run: ./scripts/ValidateRelease.ps1 -ExpectedTag $env:GITHUB_REF_NAME
      - name: Upload release verification evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: release-test-evidence
          path: |
            artifacts/test-results/
            artifacts/*smoke*.txt
            artifacts/crash-validation-*/diagnostics/
          retention-days: 14
          if-no-files-found: warn
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $version = ([xml](Get-Content -LiteralPath 'Directory.Build.props' -Raw)).Project.PropertyGroup.FormeVersion
          gh release create $env:GITHUB_REF_NAME "artifacts/Forme-Setup-$version.exe" "artifacts/Forme-$version-win-x64.zip" artifacts/SHA256SUMS.txt --title "Forme $version" --generate-notes
