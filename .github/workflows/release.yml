name: Publish Windows release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 25
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      DOTNET_SKIP_FIRST_TIME_EXPERIENCE: '1'
      TESTINGPLATFORM_TELEMETRY_OPTOUT: '1'
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: '**/packages.lock.json'
      - name: Validate tag and build installer
        shell: pwsh
        run: |
          [xml]$props = Get-Content -LiteralPath 'Directory.Build.props' -Raw
          $version = $props.Project.PropertyGroup.FormeVersion
          if ($env:GITHUB_REF_NAME -ne "v$version") { throw "Tag must match v$version" }
          ./scripts/build.ps1 -Test -Package
          Copy-Item 'artifacts/payload.zip' "artifacts/Forme-$version-win-x64.zip"
          $files = @("artifacts/Forme-Setup-$version.exe", "artifacts/Forme-$version-win-x64.zip")
          $lines = foreach ($file in $files) {
            $hash = (Get-FileHash -LiteralPath $file -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash  $([IO.Path]::GetFileName($file))"
          }
          Set-Content -LiteralPath 'artifacts/SHA256SUMS.txt' -Value $lines -Encoding ascii
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $version = ([xml](Get-Content -LiteralPath 'Directory.Build.props' -Raw)).Project.PropertyGroup.FormeVersion
          gh release create $env:GITHUB_REF_NAME "artifacts/Forme-Setup-$version.exe" "artifacts/Forme-$version-win-x64.zip" artifacts/SHA256SUMS.txt --title "Forme $version" --generate-notes
