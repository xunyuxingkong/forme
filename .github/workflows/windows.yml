name: Windows validation

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: windows-latest
    timeout-minutes: 25
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      DOTNET_SKIP_FIRST_TIME_EXPERIENCE: '1'
      TESTINGPLATFORM_TELEMETRY_OPTOUT: '1'
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: '**/packages.lock.json'
      - name: Validate release pipeline
        shell: pwsh
        run: ./scripts/ValidateRelease.ps1
      - name: Upload test evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-evidence
          path: |
            artifacts/test-results/
            artifacts/*smoke*.txt
            artifacts/crash-validation-*/diagnostics/
          retention-days: 14
          if-no-files-found: warn
      - name: Upload verified installer
        uses: actions/upload-artifact@v7
        with:
          name: forme-windows-x64
          path: |
            artifacts/Forme-Setup-*.exe
            artifacts/Forme-*-win-x64.zip
            artifacts/SHA256SUMS.txt
          retention-days: 14
          if-no-files-found: error
